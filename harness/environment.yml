name: container-env
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - bzip2=1.0.8
  - ca-certificates=2023.05.30
  - ld_impl_linux-64=2.38
  - libffi=3.4.4
  - libgcc-ng=11.2.0
  - libgomp=11.2.0
  - libstdcxx-ng=11.2.0
  - libuuid=1.41.5
  - ncurses=6.4
  - openssl=3.0.9
  - pip=23.1.2
  - python=3.10.12
  - readline=8.2
  - setuptools=67.8.0
  - tk=8.6.12
  - tzdata=2023c
  - wheel=0.38.4
  - xz=5.4.2
  - zlib=1.2.13
  - pip:
      - werkzeug==2.3.6
      - requests==2.31.0
      - python_libsedml
      - pymetadata
      - python_libsbml 
      - boto3
prefix: /home/vagrant/anaconda3/envs/container-env
