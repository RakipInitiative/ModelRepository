# Builds the shared base images in bases/<name>/ that model Dockerfiles start FROM.
#
#   pull request   build + check, nothing is pushed
#   push to master build + check + push to Harbor (<base project>/<name>:<VERSION>), digest in the job summary
#   manual run     same as push, for one base
#
# Why bases exist: a node stores a layer once only if it is byte-identical in all images that use it. The
# parts every model of a family repeated (OS tools, Miniconda, the harness conda environment, common packages)
# are built ONCE here; a model's Dockerfile starts FROM the base by digest and adds only its own packages,
# the harness scripts and the FSKX model (see bases/*/Dockerfile and CURATOR_GUIDE.md).
#
# A base folder holds Dockerfile, VERSION (positive integer, same rule as a model version), check.sh (runs inside the
# built image) and optional example-*.Dockerfile (documentation, never triggers a build). The build context is
# harness/ (the Dockerfiles copy environment.yml from it). The harness conda environment is baked into the bases:
# when harness/environment.yml changes, raise VERSION of every base (the build is not triggered by it on its own).
#
# A pushed tag is never overwritten. A base is not "latest": models name it by digest (tools/base_images.py
# check-pins fails a model pull request otherwise), so rebuilding a base changes no existing model until that
# model's Dockerfile is bumped and re-tested.
#
# Repository settings needed before the first push run (in addition to those of build-model.yml):
#   Harbor project "fskx-base" (see HARBOR_BASE_PROJECT), PUBLIC, so pull request builds of models can pull a base
#     without any secret (the bases contain only public software and the harness scripts' environment).
#   environment "harbor-push": secrets HARBOR_BASE_USERNAME, HARBOR_BASE_PASSWORD (a push robot of that project;
#     the model push robot belongs to project "fskx" only).
# Actions are pinned to commit SHAs (public repo), same pins as build-model.yml.
name: build-base

on:
  pull_request:
    paths:
      - "bases/**"
      - ".github/workflows/build-base.yml"
  push:
    branches: [master]
    paths:
      - "bases/**"
  workflow_dispatch:
    inputs:
      base:
        description: "Base name (folder name under bases/)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-base-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HARBOR_REGISTRY: harbor.cloudferro-dev.risk-ai-cloud.com
  HARBOR_BASE_PROJECT: fskx-base

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools
            bases
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_NAME: ${{ inputs.base }}
        run: |
          base=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            names=$(python3 tools/base_images.py only "$BASE_NAME")
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE"
            base="$BEFORE"
          else
            base="HEAD^"
          fi
          if [ -n "$base" ]; then
            names=$(python3 tools/base_images.py changed "$base" HEAD)
            python3 tools/base_images.py check-bump "$base" HEAD "$names"
          fi
          echo "bases: $names"
          echo "matrix={\"name\":$names}" >> "$GITHUB_OUTPUT"
          if [ "$names" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') && 'harbor-push' || 'pr-build' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      BASE_NAME: ${{ matrix.name }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            harness
            bases/${{ matrix.name }}

      - name: Read version
        id: info
        run: |
          version=$(tr -d '[:space:]' < "bases/$BASE_NAME/VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${HARBOR_REGISTRY}/${HARBOR_BASE_PROJECT}/${BASE_NAME}:${version}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "No Docker Hub credentials; pulling anonymously."
          fi

      - name: Check that the version tag is still free in Harbor
        if: env.PUBLISH == 'true'
        env:
          HARBOR_BASE_USERNAME: ${{ secrets.HARBOR_BASE_USERNAME }}
          HARBOR_BASE_PASSWORD: ${{ secrets.HARBOR_BASE_PASSWORD }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          url="https://${HARBOR_REGISTRY}/api/v2.0/projects/${HARBOR_BASE_PROJECT}/repositories/${BASE_NAME}/artifacts/${VERSION}"
          code=$(printf 'user = "%s:%s"\n' "$HARBOR_BASE_USERNAME" "$HARBOR_BASE_PASSWORD" | curl -sS -K - -o /dev/null -w '%{http_code}' "$url")
          case "$code" in
            404) echo "Tag ${VERSION} does not exist yet." ;;
            200) echo "::error::${BASE_NAME}:${VERSION} already exists in Harbor. Increase bases/${BASE_NAME}/VERSION."; exit 1 ;;
            *)   echo "::error::Could not check Harbor (HTTP ${code}); not pushing blindly."; exit 1 ;;
          esac

      - name: Build image
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          env_sha=$(sha256sum harness/environment.yml | cut -d' ' -f1)
          docker buildx build --platform linux/amd64 --load \
            --file "bases/$BASE_NAME/Dockerfile" \
            --label "fskx.base-name=${BASE_NAME}" \
            --label "fskx.base-version=${VERSION}" \
            --label "fskx.harness-env-sha256=${env_sha}" \
            --label "fskx.build-run-url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" \
            harness
          docker image inspect "$IMAGE" --format 'built {{.Architecture}}/{{.Os}} {{.Size}} bytes'
          df -h /

      - name: Check the image
        run: |
          docker run --rm --platform linux/amd64 --entrypoint bash \
            -v "$PWD/bases/$BASE_NAME/check.sh:/check.sh:ro" "$IMAGE" /check.sh

      - name: Push to Harbor
        if: env.PUBLISH == 'true'
        env:
          HARBOR_BASE_USERNAME: ${{ secrets.HARBOR_BASE_USERNAME }}
          HARBOR_BASE_PASSWORD: ${{ secrets.HARBOR_BASE_PASSWORD }}
        run: |
          echo "$HARBOR_BASE_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_BASE_USERNAME" --password-stdin
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          {
            echo "### Pushed \`${IMAGE}\`"
            echo ""
            echo "Use in a model Dockerfile:"
            echo ""
            echo "\`\`\`dockerfile"
            echo "FROM ${digest}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (no push)
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "### Built and checked \`${IMAGE}\`"
            echo ""
            echo "Not pushed: pull request run."
          } >> "$GITHUB_STEP_SUMMARY"
